rules:
  - id: pepper.go.command-injection
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      Request input controls the program or the shell command that is run.
      An attacker can execute arbitrary commands on the server.
      Fix: run a fixed binary with exec.Command("tool", arg1, arg2) - never
      "sh -c" with request data and never a program name taken from the
      request - and validate arguments against an allow-list.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      pepper_severity: CRITICAL
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
    # Indexing a fixed table with request data is an allow-list, not a flow;
    # numbers and booleans cannot carry an injection payload.
    options:
      taint_assume_safe_indexes: true
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
    pattern-sources:
      # net/http handlers
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $FN(..., $R *http.Request, ...) { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $R *http.Request, ...) { ... }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) { ... }
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.RawQuery
              - pattern: $R.Form
              - pattern: $R.PostForm
              - pattern: $R.Header
              - pattern: $R.Body
              - patterns:
                  - pattern: $R.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(FormValue|PostFormValue|Cookie|Cookies|Referer|PathValue|FormFile|MultipartReader)$
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # gin / fiber / echo handlers
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $FN(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func $FN(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func $FN(..., $C echo.Context, ...) $RET { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C echo.Context, ...) $RET { ... }
              - pattern-inside: |
                  func(..., $C echo.Context, ...) $RET { ... }
          - pattern: $C.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(Query|DefaultQuery|QueryArray|GetQuery|QueryMap|Param|Params|PostForm|DefaultPostForm|PostFormArray|GetPostForm|GetHeader|GetRawData|Cookie|Cookies|QueryParam|QueryParams|QueryString|FormValue|FormParams|Body|Get|FormFile)$
      # Request bodies decoded into a struct
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern: $C.$BIND(&$X)
                  - metavariable-regex:
                      metavariable: $BIND
                      regex: ^(Bind|BindJSON|BindQuery|BindUri|ShouldBind|ShouldBindJSON|ShouldBindQuery|ShouldBindUri|ShouldBindWith|BodyParser|QueryParser)$
              - pattern: json.NewDecoder($R.Body).Decode(&$X)
          - focus-metavariable: $X
    pattern-sanitizers:
      # Values that cannot carry attacker-shaped text.
      - pattern-either:
          - pattern: len(...)
          - pattern: strconv.Itoa(...)
          - pattern: strconv.FormatInt(...)
          - pattern: uuid.New()
          - pattern: uuid.NewString()
      - pattern-either:
          - pattern: strconv.Atoi(...)
          - pattern: strconv.ParseInt(...)
          - pattern: shellescape.Quote(...)
    pattern-sinks:
      # Program name from the request
      - patterns:
          - pattern-either:
              - pattern: exec.Command($CMD, ...)
              - pattern: exec.CommandContext($CTX, $CMD, ...)
              - pattern: syscall.Exec($CMD, ...)
          - focus-metavariable: $CMD
      # Shell with -c and a request-controlled script
      - patterns:
          - pattern-either:
              - pattern: exec.Command($SH, $FLAG, $CMD, ...)
              - pattern: exec.CommandContext($CTX, $SH, $FLAG, $CMD, ...)
          - metavariable-regex:
              metavariable: $SH
              regex: ^"(/bin/|/usr/bin/)?(sh|bash|zsh|dash|ksh|cmd|cmd\.exe|powershell|pwsh)"$
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^"(-c|/c|/C|-Command)"$
          - focus-metavariable: $CMD
