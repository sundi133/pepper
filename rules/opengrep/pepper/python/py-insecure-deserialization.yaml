rules:
  - id: pepper.py.insecure-deserialization
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Request data is deserialized with a format that can construct arbitrary
      objects (pickle, marshal, dill, shelve, jsonpickle, unsafe YAML). An
      attacker can send a payload that executes code on the server.
      Fix: accept only data formats - `json.loads()`, `yaml.safe_load()` -
      and validate the result; if objects must be exchanged, sign them with an
      HMAC and verify before loading.
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      pepper_severity: CRITICAL
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
        - https://docs.python.org/3/library/pickle.html
    # Indexing a fixed table with request data is an allow-list, not a flow.
    options:
      taint_assume_safe_indexes: true
    pattern-sources:
      - patterns:
          - pattern: $REQ.$ATTR
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(request|req|self\.request|flask\.request)$
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|files|cookies|headers|GET|POST|COOKIES|META|FILES|body|query_params|path_params|get_json|get_data)$
      - patterns:
          - pattern-inside: |
              @$APP.$VERB(...)
              def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(route|get|post|put|patch|delete|api_route)$
          - pattern-not-inside: |
              def $F(..., $P = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $F(..., $P: $T = Depends(...), ...):
                ...
          - pattern: $P
    pattern-sanitizers:
      # Values that cannot carry attacker-shaped text: records loaded by id,
      # framework URL builders, translations, lengths, booleans and digests.
      - pattern-either:
          - pattern: get_object_or_404(...)
          - pattern: get_list_or_404(...)
          - pattern: $M.objects.get(...)
          - pattern: $M.objects.get_or_create(...)
          - pattern: $M.objects.filter(...).first()
          - pattern: $M.query.get(...)
          - pattern: $M.query.get_or_404(...)
          - pattern: $M.query.filter_by(...).first()
          - pattern: $M.query.filter_by(...).first_or_404()
          - pattern: $Q.one()
          - pattern: $Q.one_or_none()
          - pattern: $Q.scalar_one()
          - pattern: $Q.scalar_one_or_none()
          - patterns:
              - pattern: $SESSION.get($MODEL, ...)
              - metavariable-regex:
                  metavariable: $MODEL
                  regex: ^[A-Z]\w*$
          - pattern: url_for(...)
          - pattern: reverse(...)
          - pattern: reverse_lazy(...)
          - pattern: len(...)
          - pattern: bool(...)
          - pattern: isinstance(...)
          - pattern: hashlib.$H(...).hexdigest()
          - pattern: hmac.new(...).hexdigest()
          - pattern: uuid.uuid4()
          - pattern: gettext(...)
          - pattern: _(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: pickle.loads($D, ...)
              - pattern: pickle.load($D, ...)
              - pattern: cPickle.loads($D, ...)
              - pattern: _pickle.loads($D, ...)
              - pattern: dill.loads($D, ...)
              - pattern: marshal.loads($D, ...)
              - pattern: jsonpickle.decode($D, ...)
              - pattern: shelve.open($D, ...)
              - pattern: yaml.unsafe_load($D, ...)
              - pattern: yaml.load($D, Loader=yaml.Loader, ...)
              - pattern: yaml.load($D, Loader=yaml.UnsafeLoader, ...)
              - pattern: yaml.load($D, Loader=yaml.FullLoader, ...)
              - pattern: yaml.load($D, Loader=Loader, ...)
              - pattern: yaml.load($D, Loader=UnsafeLoader, ...)
              - pattern: yaml.load($D)
              - pattern: pandas.read_pickle($D, ...)
              - pattern: pd.read_pickle($D, ...)
              - pattern: torch.load($D, ...)
              - pattern: joblib.load($D, ...)
          - pattern-not: torch.load(..., weights_only=True, ...)
          - focus-metavariable: $D
