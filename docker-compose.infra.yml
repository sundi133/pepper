# Pepper — infrastructure only (Postgres + Redis + MinIO).
#
# Use this for LOCAL DEVELOPMENT / TESTING when you want to run the Next.js app
# and the worker directly on your host (npm run dev / npm run worker) with hot
# reload, while the stateful backing services run in Docker.
#
# This is the drop-in replacement for Supabase: Pepper only needs a plain
# PostgreSQL database (plus Redis for the job queue and MinIO for object
# storage) — none of which are Supabase-specific.
#
#   docker compose -f docker-compose.infra.yml up -d
#
# Host ports are deliberately non-default to avoid clashing with any Postgres
# already running on 5432. Point your .env DATABASE_URL at port 5544 (see
# docs/LOCAL_SETUP.md). To tear everything down (including data):
#
#   docker compose -f docker-compose.infra.yml down -v
name: pepper-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pepper
      POSTGRES_USER: pepper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pepper_dev}
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pepper"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
