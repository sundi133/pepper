rules:
  - id: pepper.go.path-traversal
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      Request input is used as a file path. An attacker can use "../" or an
      absolute path to read, overwrite or delete files outside the intended
      directory.
      Fix: use `filepath.Base()` for a bare file name, or Go 1.24 `os.Root` /
      `filepath.IsLocal()`; otherwise join with a fixed base, `filepath.Clean`
      and check the result still has the base as prefix.
    metadata:
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://owasp.org/www-community/attacks/Path_Traversal
        - https://go.dev/blog/osroot
    # Indexing a fixed table with request data is an allow-list, not a flow;
    # numbers and booleans cannot carry an injection payload.
    options:
      taint_assume_safe_indexes: true
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
    pattern-sources:
      # net/http handlers
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $FN(..., $R *http.Request, ...) { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $R *http.Request, ...) { ... }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) { ... }
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.RawQuery
              - pattern: $R.Form
              - pattern: $R.PostForm
              - pattern: $R.Header
              - pattern: $R.Body
              - patterns:
                  - pattern: $R.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(FormValue|PostFormValue|Cookie|Cookies|Referer|PathValue|FormFile|MultipartReader)$
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # gin / fiber / echo handlers
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $FN(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func $FN(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func $FN(..., $C echo.Context, ...) $RET { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C echo.Context, ...) $RET { ... }
              - pattern-inside: |
                  func(..., $C echo.Context, ...) $RET { ... }
          - pattern: $C.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(Query|DefaultQuery|QueryArray|GetQuery|QueryMap|Param|Params|PostForm|DefaultPostForm|PostFormArray|GetPostForm|GetHeader|GetRawData|Cookie|Cookies|QueryParam|QueryParams|QueryString|FormValue|FormParams|Body|Get|FormFile)$
      # Request bodies decoded into a struct
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern: $C.$BIND(&$X)
                  - metavariable-regex:
                      metavariable: $BIND
                      regex: ^(Bind|BindJSON|BindQuery|BindUri|ShouldBind|ShouldBindJSON|ShouldBindQuery|ShouldBindUri|ShouldBindWith|BodyParser|QueryParser)$
              - pattern: json.NewDecoder($R.Body).Decode(&$X)
          - focus-metavariable: $X
    pattern-sanitizers:
      # Values that cannot carry attacker-shaped text.
      - pattern-either:
          - pattern: len(...)
          - pattern: strconv.Itoa(...)
          - pattern: strconv.FormatInt(...)
          - pattern: uuid.New()
          - pattern: uuid.NewString()
      - pattern-either:
          - pattern: filepath.Base(...)
          - pattern: path.Base(...)
          - pattern: filepath.Clean("/" + ...)
          - pattern: path.Clean("/" + ...)
          - pattern: strconv.Atoi(...)
          - pattern: uuid.Parse(...)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: strings.HasPrefix($P, ...)
              - pattern: filepath.IsLocal($P)
              - pattern: filepath.Rel($BASE, $P)
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($P)
              - pattern: os.OpenFile($P, ...)
              - pattern: os.ReadFile($P)
              - pattern: ioutil.ReadFile($P)
              - pattern: os.Create($P)
              - pattern: os.WriteFile($P, ...)
              - pattern: ioutil.WriteFile($P, ...)
              - pattern: os.Remove($P)
              - pattern: os.RemoveAll($P)
              - pattern: os.Rename($P, ...)
              - pattern: os.Rename($SRC, $P)
              - pattern: os.Mkdir($P, ...)
              - pattern: os.MkdirAll($P, ...)
              - pattern: os.ReadDir($P)
              - pattern: http.ServeFile($W, $REQ, $P)
          # Containment check on the cleaned path before use
          - pattern-not-inside: |
              if <... strings.HasPrefix(<... $P ...>, ...) ...> { ... }
              ...
          - pattern-not-inside: |
              if <... filepath.IsLocal(<... $P ...>) ...> { ... }
              ...
          - focus-metavariable: $P
      # gin / fiber / echo file responses and upload saves
      - patterns:
          - pattern-either:
              - pattern: $C.File($P)
              - pattern: $C.FileAttachment($P, ...)
              - pattern: $C.Attachment($P, ...)
              - pattern: $C.SendFile($P, ...)
              - pattern: $C.Download($P, ...)
              - pattern: $C.SaveUploadedFile($F, $P)
              - pattern: $C.SaveFile($F, $P)
          - pattern-either:
              - pattern-inside: |
                  func $FN(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func $FN(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func $FN(..., $C echo.Context, ...) $RET { ... }
              - pattern-inside: |
                  func(..., $C echo.Context, ...) $RET { ... }
          # Containment check on the cleaned path before use
          - pattern-not-inside: |
              if <... strings.HasPrefix(<... $P ...>, ...) ...> { ... }
              ...
          - pattern-not-inside: |
              if <... filepath.IsLocal(<... $P ...>) ...> { ... }
              ...
          - focus-metavariable: $P
