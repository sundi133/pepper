rules:
  - id: pepper.js.weak-password-hash
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A password or secret is hashed with a fast, broken hash (MD5/SHA-1).
      Stolen hashes can be cracked quickly.
      Fix: use a password hashing function - bcrypt, scrypt
      (`crypto.scrypt`), or Argon2 - with a per-user salt.
    metadata:
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    patterns:
      - pattern-either:
          - pattern: $C.createHash($ALG).update($PW, ...)
          - pattern: createHash($ALG).update($PW, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^["'`]?(md5|md4|sha1|sha-1)["'`]?$
      - metavariable-regex:
          metavariable: $PW
          regex: (?i).*(passw(or)?d|passwd|pwd|secret|pin)
