rules:
  - id: pepper.php.path-traversal
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      Request input is used as a file path (or URL) for a file operation. An
      attacker can use "../" to read, overwrite or delete files outside the
      intended directory; with file_get_contents/fopen a full URL also lets
      them make the server fetch internal resources.
      Fix: take `basename()` of the input, resolve it against a fixed
      directory with `realpath()` and check the result still starts with that
      directory.
    metadata:
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://owasp.org/www-community/attacks/Path_Traversal
    # Indexing a fixed table with request data is an allow-list, not a flow.
    options:
      taint_assume_safe_indexes: true
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: getallheaders()
          - pattern: file_get_contents("php://input")
          - pattern: file_get_contents('php://input')
          - patterns:
              - pattern: $_SERVER[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: ^["'](QUERY_STRING|REQUEST_URI|PHP_SELF|PATH_INFO|ORIG_PATH_INFO|HTTP_[A-Z_]+)["']$
          # Laravel / Symfony request objects
          - patterns:
              - pattern-either:
                  - pattern: $REQ->$M(...)
                  - pattern: request()->$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(input|get|query|post|all|cookie|header|json|route|file|only|except|string|getContent|getQueryString|getRequestUri|getPathInfo)$
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req|this->request)$
          - patterns:
              - pattern: $REQ->$BAG
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req|this->request)$
              - metavariable-regex:
                  metavariable: $BAG
                  regex: ^(query|request|cookies|headers|files|attributes)$
          - pattern: request($KEY)
          - pattern: Input::get(...)
          - pattern: Request::input(...)
          - pattern: Request::get(...)
    pattern-sanitizers:
      # Values that cannot carry attacker-shaped text: numbers, booleans,
      # digests, dates, translations, records loaded by id and same-site URL
      # builders.
      - pattern-either:
          - pattern: count(...)
          - pattern: sizeof(...)
          - pattern: strlen(...)
          - pattern: mb_strlen(...)
          - pattern: isset(...)
          - pattern: empty(...)
          - pattern: in_array(...)
          - pattern: array_key_exists(...)
          - pattern: is_numeric(...)
          - pattern: ctype_digit(...)
          - pattern: ctype_alnum(...)
          - pattern: preg_match(...)
          - pattern: absint(...)
          - pattern: md5(...)
          - pattern: sha1(...)
          - pattern: hash(...)
          - pattern: hash_hmac(...)
          - pattern: crc32(...)
          - pattern: uniqid(...)
          - pattern: password_hash(...)
          - pattern: number_format(...)
          - pattern: number_format_i18n(...)
          - pattern: size_format(...)
          - pattern: date(...)
          - pattern: gmdate(...)
          - pattern: date_i18n(...)
          - pattern: mysql2date(...)
          - pattern: __(...)
          - pattern: _x(...)
          - pattern: _n(...)
          - pattern: esc_html__(...)
          - pattern: esc_attr__(...)
          - pattern: selected(...)
          - pattern: checked(...)
          - pattern: disabled(...)
          - pattern: sanitize_key(...)
          - pattern: sanitize_title(...)
          - pattern: sanitize_file_name(...)
          - pattern: sanitize_user(...)
          - pattern: sanitize_email(...)
          - pattern: wp_create_nonce(...)
          - pattern: get_post(...)
          - pattern: get_userdata(...)
          - pattern: get_user_by(...)
          - pattern: get_term(...)
          - pattern: admin_url(...)
          - pattern: self_admin_url(...)
          - pattern: network_admin_url(...)
          - pattern: user_admin_url(...)
          - pattern: home_url(...)
          - pattern: site_url(...)
          - pattern: network_home_url(...)
          - pattern: network_site_url(...)
          - pattern: get_admin_url(...)
          - pattern: get_permalink(...)
          - pattern: wp_login_url(...)
          - pattern: wp_logout_url(...)
          - pattern: plugins_url(...)
          - pattern: content_url(...)
          - pattern: includes_url(...)
          - pattern: route(...)
          - pattern: action(...)
          - pattern: $MODEL::find(...)
          - pattern: $MODEL::findOrFail(...)
          - pattern: $MODEL::firstOrFail(...)
      - pattern-either:
          - pattern: basename(...)
          - pattern: (int) $X
          - pattern: intval(...)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: str_starts_with($P, ...)
              - pattern: strpos($P, ...) === 0
              - pattern: strpos($P, ...) !== 0
              - pattern: strncmp($P, ...)
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: file_get_contents($P, ...)
              - pattern: file_put_contents($P, ...)
              - pattern: fopen($P, ...)
              - pattern: file($P, ...)
              - pattern: readfile($P, ...)
              - pattern: unlink($P, ...)
              - pattern: rmdir($P, ...)
              - pattern: copy($P, ...)
              - pattern: copy($SRC, $P, ...)
              - pattern: rename($P, ...)
              - pattern: rename($SRC, $P, ...)
              - pattern: move_uploaded_file($TMP, $P)
              - pattern: parse_ini_file($P, ...)
              - pattern: highlight_file($P, ...)
              - pattern: show_source($P, ...)
              - pattern: fpassthru(fopen($P, ...))
              - pattern: new SplFileObject($P, ...)
              - pattern: Storage::get($P)
              - pattern: Storage::delete($P)
              - pattern: response()->download($P, ...)
              - pattern: response()->file($P, ...)
              - pattern: new BinaryFileResponse($P, ...)
          # Containment check on the resolved path before use
          - pattern-not-inside: |
              if (<... str_starts_with(<... $P ...>, ...) ...>) { ... }
              ...
          - pattern-not-inside: |
              if (<... strpos(<... $P ...>, ...) ...>) { ... }
              ...
          - pattern-not-inside: |
              if (<... strncmp(<... $P ...>, ...) ...>) { ... }
              ...
          - focus-metavariable: $P
