rules:
  - id: pepper.js.tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      TLS certificate verification is disabled, so connections can be
      intercepted (man-in-the-middle).
      Fix: remove `rejectUnauthorized: false` / NODE_TLS_REJECT_UNAUTHORIZED=0;
      for an internal CA, pass its certificate via `ca` or NODE_EXTRA_CA_CERTS.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://nodejs.org/api/tls.html#tlsconnectoptions-callback
    pattern-either:
      - pattern: |
          {..., rejectUnauthorized: false, ...}
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
