rules:
  - id: pepper.py.weak-password-hash
    languages: [python]
    severity: ERROR
    message: >-
      A password is hashed with a fast general-purpose hash (MD5/SHA-1/SHA-2).
      Stolen hashes can be cracked at billions of guesses per second.
      Fix: use a password hashing function with a per-user salt - argon2-cffi,
      bcrypt, `hashlib.scrypt`, or Django's/Werkzeug's `make_password` /
      `generate_password_hash`.
    metadata:
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    patterns:
      - pattern-either:
          - pattern: hashlib.$ALG($PW, ...)
          - pattern: hashlib.$ALG(...).update($PW, ...)
          - pattern: hashlib.new($NAME, $PW, ...)
      - metavariable-regex:
          metavariable: $PW
          regex: (?i)^(\w+\s*\+\s*)?(\w+\.)*(\w+_)?(password|passwd|pwd)\d?(\s*\+\s*\w+)?(\.encode\([^)]*\))?$
      - pattern-either:
          - patterns:
              - pattern: hashlib.$ALG(...)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: ^(md5|sha1|sha224|sha256|sha384|sha512|sha3_256|sha3_512|blake2b|blake2s)$
          - patterns:
              - pattern: hashlib.new($NAME, ...)
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i)^["'](md5|md4|sha1|sha256|sha512)["']$
          - pattern: hashlib.$ALG(...).update($PW, ...)
