rules:
  - id: pepper.rb.xss-escaping-disabled
    mode: taint
    languages: [ruby]
    severity: ERROR
    message: >-
      Request input is marked as HTML-safe (raw/html_safe or render html:)
      so Rails does not escape it. An attacker can inject script that runs
      in other users' browsers.
      Fix: let ERB escape the value (`<%= value %>`); for rich text use
      `sanitize(value)` with an allow-list, never raw/html_safe on request
      data.
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
      references:
        - https://guides.rubyonrails.org/security.html#cross-site-scripting-xss
    # Indexing a fixed table with request data is an allow-list, not a flow.
    options:
      taint_assume_safe_indexes: true
    pattern-sources:
      # Rails / Grape / Sinatra-class controllers
      - patterns:
          - pattern-inside: |
              class $CTRL < $BASE
                ...
              end
          # (metavariable-regex does not match Ruby class names here; a
          # metavariable-pattern with pattern-regex does)
          - metavariable-pattern:
              metavariable: $CTRL
              patterns:
                - pattern-regex: (Controller|API|App|Application|Server|Routes|Endpoint)$
          - pattern-either:
              - pattern: params
              - pattern: cookies
              - pattern: request.params
              - pattern: request.query_parameters
              - pattern: request.request_parameters
              - pattern: request.path_parameters
              - pattern: request.headers
              - pattern: request.body
              - pattern: request.raw_post
              - pattern: request.query_string
              - pattern: request.referer
              - pattern: request.referrer
              - pattern: request.cookies
      # Sinatra classic route blocks
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $VERB $ROUTE do
                    ...
                  end
              - pattern-inside: |
                  $VERB($ROUTE) do
                    ...
                  end
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(get|post|put|patch|delete|options)$
          - pattern-either:
              - pattern: params
              - pattern: cookies
              - pattern: request.params
              - pattern: request.query_parameters
              - pattern: request.request_parameters
              - pattern: request.path_parameters
              - pattern: request.headers
              - pattern: request.body
              - pattern: request.raw_post
              - pattern: request.query_string
              - pattern: request.referer
              - pattern: request.referrer
              - pattern: request.cookies
    pattern-sanitizers:
      # Values that cannot carry attacker-shaped text: records loaded by id,
      # route helpers (same-site URLs), translations, numbers and booleans.
      - pattern-either:
          - patterns:
              - pattern: $M.$FIND(...)
              - metavariable-regex:
                  metavariable: $FIND
                  regex: ^(find|find_by|find_by!|find_sole_by|find_or_create_by|find_or_create_by!|find_or_initialize_by|exists\?)$
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(?!params\b|cookies\b|request\b)
          - patterns:
              - pattern-either:
                  - pattern: $HELPER(...)
                  - pattern: $RECV.$HELPER(...)
              - metavariable-regex:
                  metavariable: $HELPER
                  regex: ^[a-z]\w*_(path|url)$
              - metavariable-regex:
                  metavariable: $HELPER
                  regex: ^(?!(original|request|base|full|redirect|return|callback|referr?er|back|next|target|destination|image|avatar|source|remote|external|cdn)_)
          - pattern: I18n.t(...)
          - pattern: I18n.translate(...)
          - pattern: t(...)
          - patterns:
              - pattern: $X.$PRED
              - metavariable-regex:
                  metavariable: $PRED
                  regex: ^(to_i|to_f|count|size|length|present\?|blank\?|nil\?|empty\?|any\?|none\?|include\?|exists\?)$
          - pattern: Digest::$H.hexdigest(...)
          - pattern: SecureRandom.$R(...)
      - pattern-either:
          - pattern: sanitize(...)
          - pattern: h(...)
          - pattern: html_escape(...)
          - pattern: ERB::Util.html_escape(...)
          - pattern: CGI.escapeHTML(...)
          - pattern: strip_tags(...)
          - pattern: $X.to_i
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: raw($X)
              - pattern: $X.html_safe
              - pattern: |
                  render(html: $X, ...)
              - pattern: |
                  render html: $X
              - pattern: |
                  render(text: $X, ...)
              - pattern: ActiveSupport::SafeBuffer.new($X)
          - focus-metavariable: $X
