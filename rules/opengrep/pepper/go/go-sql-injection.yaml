rules:
  - id: pepper.go.sql-injection
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      Request input reaches a SQL query string. An attacker can change the
      query (read or modify any data, bypass authentication).
      Fix: use placeholders and pass values as arguments -
      `db.Query("SELECT ... WHERE id = $1", id)` (or `?` for MySQL/SQLite) -
      instead of building the SQL with fmt.Sprintf or string concatenation.
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      pepper_severity: CRITICAL
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
        - https://go.dev/doc/database/sql-injection
    # Indexing a fixed table with request data is an allow-list, not a flow;
    # numbers and booleans cannot carry an injection payload.
    options:
      taint_assume_safe_indexes: true
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
    pattern-sources:
      # net/http handlers
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $FN(..., $R *http.Request, ...) { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $R *http.Request, ...) { ... }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) { ... }
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.RawQuery
              - pattern: $R.Form
              - pattern: $R.PostForm
              - pattern: $R.Header
              - pattern: $R.Body
              - patterns:
                  - pattern: $R.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(FormValue|PostFormValue|Cookie|Cookies|Referer|PathValue|FormFile|MultipartReader)$
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # gin / fiber / echo handlers
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $FN(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func $FN(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func $FN(..., $C echo.Context, ...) $RET { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C echo.Context, ...) $RET { ... }
              - pattern-inside: |
                  func(..., $C echo.Context, ...) $RET { ... }
          - pattern: $C.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(Query|DefaultQuery|QueryArray|GetQuery|QueryMap|Param|Params|PostForm|DefaultPostForm|PostFormArray|GetPostForm|GetHeader|GetRawData|Cookie|Cookies|QueryParam|QueryParams|QueryString|FormValue|FormParams|Body|Get|FormFile)$
      # Request bodies decoded into a struct
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern: $C.$BIND(&$X)
                  - metavariable-regex:
                      metavariable: $BIND
                      regex: ^(Bind|BindJSON|BindQuery|BindUri|ShouldBind|ShouldBindJSON|ShouldBindQuery|ShouldBindUri|ShouldBindWith|BodyParser|QueryParser)$
              - pattern: json.NewDecoder($R.Body).Decode(&$X)
          - focus-metavariable: $X
    pattern-sanitizers:
      # Values that cannot carry attacker-shaped text.
      - pattern-either:
          - pattern: len(...)
          - pattern: strconv.Itoa(...)
          - pattern: strconv.FormatInt(...)
          - pattern: uuid.New()
          - pattern: uuid.NewString()
      - pattern-either:
          - pattern: strconv.Atoi(...)
          - pattern: strconv.ParseInt(...)
          - pattern: strconv.ParseUint(...)
          - pattern: strconv.ParseFloat(...)
          - pattern: strconv.ParseBool(...)
          - pattern: uuid.Parse(...)
          - pattern: pq.QuoteIdentifier(...)
          - pattern: pq.QuoteLiteral(...)
    pattern-sinks:
      - patterns:
          - pattern: $DB.$Q($SQL, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)^(\w+\.)*\w*(db|tx|conn|connection|pool|database|sqlx|pgx|gorm|orm)$
          - metavariable-regex:
              metavariable: $Q
              regex: ^(Query|QueryRow|Exec|Prepare|Queryx|QueryRowx|MustExec|NamedExec|NamedQuery|Raw|Where|Or|Not|Order|Having|Joins|Group|Select)$
          - focus-metavariable: $SQL
      - patterns:
          - pattern: $DB.$QCTX($CTX, $SQL, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)^(\w+\.)*\w*(db|tx|conn|connection|pool|database|sqlx|pgx)$
          - metavariable-regex:
              metavariable: $QCTX
              regex: ^(QueryContext|QueryRowContext|ExecContext|PrepareContext|QueryxContext|QueryRowxContext|NamedExecContext|MustExecContext)$
          - focus-metavariable: $SQL
      # sqlx: db.Get(&dest, query, args...), db.Select(&dest, query, args...)
      - patterns:
          - pattern-either:
              - pattern: $DB.$G($DEST, $SQL, ...)
              - pattern: $DB.$GCTX($CTX, $DEST, $SQL, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)^(\w+\.)*\w*(db|tx|sqlx)$
          - pattern-either:
              - patterns:
                  - pattern: $DB.$G($DEST, $SQL, ...)
                  - metavariable-regex:
                      metavariable: $G
                      regex: ^(Get|Select)$
              - patterns:
                  - pattern: $DB.$GCTX($CTX, $DEST, $SQL, ...)
                  - metavariable-regex:
                      metavariable: $GCTX
                      regex: ^(GetContext|SelectContext)$
          - focus-metavariable: $SQL
