rules:
  - id: pepper.go.xss-template-escaping-bypassed
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      Request input is converted to template.HTML/JS/URL/CSS/HTMLAttr, which
      tells html/template to skip escaping. An attacker can inject script
      that runs in other users' browsers.
      Fix: pass the plain string to the template and let html/template
      escape it; sanitise rich text with bluemonday before any trusted-type
      conversion.
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
      references:
        - https://pkg.go.dev/html/template#hdr-Typed_Strings
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    # Indexing a fixed table with request data is an allow-list, not a flow;
    # numbers and booleans cannot carry an injection payload.
    options:
      taint_assume_safe_indexes: true
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
    pattern-sources:
      # net/http handlers
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $FN(..., $R *http.Request, ...) { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $R *http.Request, ...) { ... }
              - pattern-inside: |
                  func(..., $R *http.Request, ...) { ... }
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.RawQuery
              - pattern: $R.Form
              - pattern: $R.PostForm
              - pattern: $R.Header
              - pattern: $R.Body
              - patterns:
                  - pattern: $R.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(FormValue|PostFormValue|Cookie|Cookies|Referer|PathValue|FormFile|MultipartReader)$
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # gin / fiber / echo handlers
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $FN(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func(..., $C *gin.Context, ...) { ... }
              - pattern-inside: |
                  func $FN(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func(..., $C *fiber.Ctx, ...) $RET { ... }
              - pattern-inside: |
                  func $FN(..., $C echo.Context, ...) $RET { ... }
              - pattern-inside: |
                  func ($RECV $RT) $FN(..., $C echo.Context, ...) $RET { ... }
              - pattern-inside: |
                  func(..., $C echo.Context, ...) $RET { ... }
          - pattern: $C.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(Query|DefaultQuery|QueryArray|GetQuery|QueryMap|Param|Params|PostForm|DefaultPostForm|PostFormArray|GetPostForm|GetHeader|GetRawData|Cookie|Cookies|QueryParam|QueryParams|QueryString|FormValue|FormParams|Body|Get|FormFile)$
      # Request bodies decoded into a struct
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern: $C.$BIND(&$X)
                  - metavariable-regex:
                      metavariable: $BIND
                      regex: ^(Bind|BindJSON|BindQuery|BindUri|ShouldBind|ShouldBindJSON|ShouldBindQuery|ShouldBindUri|ShouldBindWith|BodyParser|QueryParser)$
              - pattern: json.NewDecoder($R.Body).Decode(&$X)
          - focus-metavariable: $X
    pattern-sanitizers:
      # Values that cannot carry attacker-shaped text.
      - pattern-either:
          - pattern: len(...)
          - pattern: strconv.Itoa(...)
          - pattern: strconv.FormatInt(...)
          - pattern: uuid.New()
          - pattern: uuid.NewString()
      - pattern-either:
          - pattern: template.HTMLEscapeString(...)
          - pattern: html.EscapeString(...)
          - pattern: $POLICY.Sanitize(...)
          - pattern: url.QueryEscape(...)
          - pattern: url.PathEscape(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: template.HTML($X)
              - pattern: template.JS($X)
              - pattern: template.URL($X)
              - pattern: template.CSS($X)
              - pattern: template.HTMLAttr($X)
              - pattern: template.JSStr($X)
              - pattern: template.Srcset($X)
          - focus-metavariable: $X
