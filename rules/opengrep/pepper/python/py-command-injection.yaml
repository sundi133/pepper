rules:
  - id: pepper.py.command-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Request input reaches a shell command. An attacker can run arbitrary
      commands on the server.
      Fix: do not use a shell - call `subprocess.run([...])` with a list of
      arguments and no `shell=True`, validate the value against an
      allow-list, or quote it with `shlex.quote()`.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      pepper_severity: CRITICAL
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
    # Indexing a fixed table with request data is an allow-list, not a flow.
    options:
      taint_assume_safe_indexes: true
    pattern-sources:
      - patterns:
          - pattern: $REQ.$ATTR
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(request|req|self\.request|flask\.request)$
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|files|cookies|headers|GET|POST|COOKIES|META|FILES|body|query_params|path_params|get_json|get_data)$
      - patterns:
          - pattern-inside: |
              @$APP.$VERB(...)
              def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(route|get|post|put|patch|delete|api_route)$
          - pattern-not-inside: |
              def $F(..., $P = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $F(..., $P: $T = Depends(...), ...):
                ...
          - pattern: $P
    pattern-sanitizers:
      # Values that cannot carry attacker-shaped text: records loaded by id,
      # framework URL builders, translations, lengths, booleans and digests.
      - pattern-either:
          - pattern: get_object_or_404(...)
          - pattern: get_list_or_404(...)
          - pattern: $M.objects.get(...)
          - pattern: $M.objects.get_or_create(...)
          - pattern: $M.objects.filter(...).first()
          - pattern: $M.query.get(...)
          - pattern: $M.query.get_or_404(...)
          - pattern: $M.query.filter_by(...).first()
          - pattern: $M.query.filter_by(...).first_or_404()
          - pattern: $Q.one()
          - pattern: $Q.one_or_none()
          - pattern: $Q.scalar_one()
          - pattern: $Q.scalar_one_or_none()
          - patterns:
              - pattern: $SESSION.get($MODEL, ...)
              - metavariable-regex:
                  metavariable: $MODEL
                  regex: ^[A-Z]\w*$
          - pattern: url_for(...)
          - pattern: reverse(...)
          - pattern: reverse_lazy(...)
          - pattern: len(...)
          - pattern: bool(...)
          - pattern: isinstance(...)
          - pattern: hashlib.$H(...).hexdigest()
          - pattern: hmac.new(...).hexdigest()
          - pattern: uuid.uuid4()
          - pattern: gettext(...)
          - pattern: _(...)
      - pattern-either:
          - pattern: shlex.quote(...)
          - pattern: pipes.quote(...)
          - pattern: int(...)
          - pattern: float(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.system($C)
              - pattern: os.popen($C, ...)
              - pattern: os.popen2($C, ...)
              - pattern: os.popen3($C, ...)
              - pattern: commands.getoutput($C)
              - pattern: commands.getstatusoutput($C)
              - pattern: subprocess.getoutput($C)
              - pattern: subprocess.getstatusoutput($C)
              - pattern: subprocess.$F($C, ..., shell=True, ...)
              - pattern: asyncio.create_subprocess_shell($C, ...)
          - focus-metavariable: $C
      # Interpreter invoked with "-c" and a command string
      - patterns:
          - pattern: subprocess.$F([$SH, "-c", $C, ...], ...)
          - metavariable-regex:
              metavariable: $SH
              regex: ^["'](/bin/|/usr/bin/)?(sh|bash|zsh|dash|ksh)["']$
          - focus-metavariable: $C
