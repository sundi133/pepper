rules:
  - id: pepper.php.ssrf
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      Request input controls the URL of a server-side HTTP request. An
      attacker can make the server call internal services or cloud metadata
      endpoints (e.g. http://169.254.169.254/) and read the response.
      Fix: do not let the caller choose the host. Validate scheme and host
      against an allow-list, resolve the host and reject private, loopback
      and link-local addresses, and restrict CURLOPT_PROTOCOLS to HTTP(S).
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    # Indexing a fixed table with request data is an allow-list, not a flow.
    options:
      taint_assume_safe_indexes: true
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: getallheaders()
          - pattern: file_get_contents("php://input")
          - pattern: file_get_contents('php://input')
          - patterns:
              - pattern: $_SERVER[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: ^["'](QUERY_STRING|REQUEST_URI|PHP_SELF|PATH_INFO|ORIG_PATH_INFO|HTTP_[A-Z_]+)["']$
          # Laravel / Symfony request objects
          - patterns:
              - pattern-either:
                  - pattern: $REQ->$M(...)
                  - pattern: request()->$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(input|get|query|post|all|cookie|header|json|route|file|only|except|string|getContent|getQueryString|getRequestUri|getPathInfo)$
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req|this->request)$
          - patterns:
              - pattern: $REQ->$BAG
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req|this->request)$
              - metavariable-regex:
                  metavariable: $BAG
                  regex: ^(query|request|cookies|headers|files|attributes)$
          - pattern: request($KEY)
          - pattern: Input::get(...)
          - pattern: Request::input(...)
          - pattern: Request::get(...)
    pattern-sanitizers:
      # Values that cannot carry attacker-shaped text: numbers, booleans,
      # digests, dates, translations, records loaded by id and same-site URL
      # builders.
      - pattern-either:
          - pattern: count(...)
          - pattern: sizeof(...)
          - pattern: strlen(...)
          - pattern: mb_strlen(...)
          - pattern: isset(...)
          - pattern: empty(...)
          - pattern: in_array(...)
          - pattern: array_key_exists(...)
          - pattern: is_numeric(...)
          - pattern: ctype_digit(...)
          - pattern: ctype_alnum(...)
          - pattern: preg_match(...)
          - pattern: absint(...)
          - pattern: md5(...)
          - pattern: sha1(...)
          - pattern: hash(...)
          - pattern: hash_hmac(...)
          - pattern: crc32(...)
          - pattern: uniqid(...)
          - pattern: password_hash(...)
          - pattern: number_format(...)
          - pattern: number_format_i18n(...)
          - pattern: size_format(...)
          - pattern: date(...)
          - pattern: gmdate(...)
          - pattern: date_i18n(...)
          - pattern: mysql2date(...)
          - pattern: __(...)
          - pattern: _x(...)
          - pattern: _n(...)
          - pattern: esc_html__(...)
          - pattern: esc_attr__(...)
          - pattern: selected(...)
          - pattern: checked(...)
          - pattern: disabled(...)
          - pattern: sanitize_key(...)
          - pattern: sanitize_title(...)
          - pattern: sanitize_file_name(...)
          - pattern: sanitize_user(...)
          - pattern: sanitize_email(...)
          - pattern: wp_create_nonce(...)
          - pattern: get_post(...)
          - pattern: get_userdata(...)
          - pattern: get_user_by(...)
          - pattern: get_term(...)
          - pattern: admin_url(...)
          - pattern: self_admin_url(...)
          - pattern: network_admin_url(...)
          - pattern: user_admin_url(...)
          - pattern: home_url(...)
          - pattern: site_url(...)
          - pattern: network_home_url(...)
          - pattern: network_site_url(...)
          - pattern: get_admin_url(...)
          - pattern: get_permalink(...)
          - pattern: wp_login_url(...)
          - pattern: wp_logout_url(...)
          - pattern: plugins_url(...)
          - pattern: content_url(...)
          - pattern: includes_url(...)
          - pattern: route(...)
          - pattern: action(...)
          - pattern: $MODEL::find(...)
          - pattern: $MODEL::findOrFail(...)
          - pattern: $MODEL::firstOrFail(...)
      - pattern-either:
          - pattern: urlencode(...)
          - pattern: rawurlencode(...)
          - pattern: (int) $X
          - pattern: intval(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: curl_init($URL)
              - pattern: curl_setopt($CH, CURLOPT_URL, $URL)
              - pattern: Http::get($URL, ...)
              - pattern: Http::post($URL, ...)
              - pattern: Http::put($URL, ...)
              - pattern: Http::delete($URL, ...)
              - pattern: wp_remote_get($URL, ...)
              - pattern: wp_remote_post($URL, ...)
              - pattern: wp_remote_request($URL, ...)
              - pattern: $CLIENT->request($METHOD, $URL, ...)
              - pattern: $CLIENT->get($URL, ...)
              - pattern: $CLIENT->post($URL, ...)
          - pattern-not-inside: $REQ->get(...)
          # A fixed scheme+host prefix only lets the caller pick a path.
          - metavariable-regex:
              metavariable: $URL
              regex: ^(?!["'](https?:)?//[^/"'{$]+/)
          - focus-metavariable: $URL
